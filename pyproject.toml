[project]
name = "ytgist"
version = "0.1.0"
description = "YouTube Gist: Web UI to grab and summarize transcripts"
readme = "README.md"
authors = [
    { name = "Travis Luckenbaugh", email = "tluckenbaugh@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "waitress>=3.0.2",
    "youtube-transcript-api",
]

[project.scripts]
ytgist = "ytgist.cli:main"
ytgist-get-transcript = "ytgist.transcript:main"
ytgist-web = "ytgist.web:main"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
